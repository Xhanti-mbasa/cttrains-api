name: Android build and release

on:
  push:
    branches: [main, feat/android-material3]
    tags: ["android-v*"]
    paths: ["android/**", "src/transit/**", "src/routes/mobile.js", "src/index.js", "package*.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/transit/**", "src/routes/mobile.js", "src/index.js", "package*.json", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag (for example android-v1.0.1); blank creates a build tag"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's old default includes the retired `tools` package.
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check the normalized transit API contract
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm run test:mobile
      - name: Determine version and source
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 scripts/release-metadata.py
      - name: Clean build, tests and lint for both variants
        env:
          CTTRAINS_VERSION_NAME: ${{ steps.metadata.outputs.version }}
          CTTRAINS_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          CTTRAINS_USE_DEVELOPMENT_SIGNING: "true"
          CTTRAINS_TRANSIT_BASE_URL: ${{ vars.CTTRAINS_TRANSIT_BASE_URL }}
          CTTRAINS_GOOGLE_WEB_CLIENT_ID: ${{ vars.CTTRAINS_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew clean :core:test :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Verify and prepare CI APK
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          SIGNING_MODE: development
          RELEASE_ASSETS_DIR: dist
        run: bash scripts/prepare-release.sh
      - name: Include APK verification utility for compatible local signing
        run: cp "${ANDROID_HOME}/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cttrains-release-apk
          retention-days: 3
          compression-level: 0
          path: android/dist/*
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          retention-days: 3
          path: |
            android/core/build/reports/tests/test/
            android/app/build/reports/lint-results-*.html
            android/app/schemas/

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Reclaim disk space for the Android emulator
        run: |
          # This hosted runner only needs the Android and Java toolchains.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h "$HOME"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native storage, timetable, backup and settings tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/scripts/check-device.sh
      - name: Upload native test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports
          retention-days: 3
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/outputs/ui-screenshots/

  publish:
    needs: [build, device]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/android-material3' || startsWith(github.ref, 'refs/tags/android-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cttrains-android-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's old default includes the retired `tools` package.
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Determine version and source
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 scripts/release-metadata.py
      - name: Assemble a signed update
        env:
          KEYSTORE_BASE64: ${{ secrets.CTTRAINS_KEYSTORE_BASE64 }}
          CTTRAINS_KEYSTORE_PASSWORD: ${{ secrets.CTTRAINS_KEYSTORE_PASSWORD }}
          CTTRAINS_KEY_ALIAS: ${{ secrets.CTTRAINS_KEY_ALIAS }}
          CTTRAINS_KEY_PASSWORD: ${{ secrets.CTTRAINS_KEY_PASSWORD }}
          CTTRAINS_VERSION_NAME: ${{ steps.metadata.outputs.version }}
          CTTRAINS_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          CTTRAINS_TRANSIT_BASE_URL: ${{ vars.CTTRAINS_TRANSIT_BASE_URL }}
          CTTRAINS_GOOGLE_WEB_CLIENT_ID: ${{ vars.CTTRAINS_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 CTTRAINS_KEYSTORE_PASSWORD CTTRAINS_KEY_ALIAS CTTRAINS_KEY_PASSWORD; do
            if [[ -z ${!name} ]]; then
              echo 'Configure all four CT Trains release signing secrets before publishing.'
              exit 1
            fi
          done
          umask 077
          export CTTRAINS_KEYSTORE_PATH="$RUNNER_TEMP/cttrains-release.jks"
          trap 'rm -f -- "$CTTRAINS_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CTTRAINS_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify the release APK
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          SIGNING_MODE: production
          RELEASE_ASSETS_DIR: ../release-assets
        run: bash scripts/prepare-release.sh
      - name: Publish directly to GitHub Releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
          SIGNING_MODE: production
        run: bash android/scripts/publish-release.sh
