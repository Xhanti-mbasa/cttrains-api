name: Developer control service checks
on:
  push:
    branches: [main]
    paths: ["control-service/**", ".github/workflows/control-service.yml"]
  pull_request:
    paths: ["control-service/**", ".github/workflows/control-service.yml"]
permissions:
  contents: read
jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test control-service/worker.test.mjs
